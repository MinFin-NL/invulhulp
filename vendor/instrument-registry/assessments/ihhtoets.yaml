    description: Deze categorie sluit aan bij het DUTO-kernproces 'Migreren'.
    id: "3.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        11. Het is mogelijk om een overzicht te genereren van de overheidsinformatie/-gegevens in de applicatie of het systeem die voor migratie in aanmerking komen.
      description: Bij 'migratie' worden informatie/gegevens overgezet van de ene opslaglocatie naar de andere.
      id: "3.2.1"
