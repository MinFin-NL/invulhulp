# yaml-language-server: $schema=../schemas/assessment-definition.v2.schema.json

name: IHH-toets
urn: urn:nl:minfin:ir:ihhtoets:0.1
version: '0.1'
description: >-
  Duurzaam toegankelijke overheidsinformatie is onmisbaar voor een betrouwbare en transparante overheid. Duurzame toegankelijkheid betekent dat overheidsinformatie vindbaar, beschikbaar, leesbaar, interpreteerbaar en betrouwbaar blijft, nu en in de toekomst. De IHH-toets brengt aan de hand van concrete vragen in beeld welke maatregelen of functionaliteiten getroffen kunnen of moeten worden om dat in de beoogde applicatie of het beoogde systeem te bevorderen. De toets volgt de kernprocessen van het DUTO-raamwerk van het Nationaal Archief: registreren, bewaren, migreren, vernietigen en ter beschikking stellen.

  Bron: Informatiehuishoudingstoets bij IV-verzoeken (IHH-toets) (Ministerie van Financiën — CDIO, afdeling Informatiehuishouding). Handmatig overgenomen uit het Word/PDF-origineel van CDIO/IHH; de achttien genummerde vragen, hun toelichtingen en de indeling naar DUTO-kernprocessen volgen het origineel woordelijk. De in het origineel dikgedrukte vragen (1, 2, 4, 5, 6, 7, 16 en 17) betreffen functionaliteiten of maatregelen die altijd van belang zijn en staan hier als 'mandatory'. Versie 0.1: nog niet vastgesteld — het origineel draagt zelf geen versienummer, en de toets wordt doorlopen onder begeleiding van een IHH-professional. Het origineel noemt 'NEN-ISO 16715-1:2020'; dat is een verschrijving voor NEN-ISO 16175-1:2020.
tasks:
- task: 'Deel A: Algemene gegevens en toelichting'
  id: "1"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: Gegevens IV-verzoek
    description: Leg vast om welk IV-verzoek het gaat en wie erbij betrokken zijn.
    id: "1.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Naam project / IV-verzoek
      id: "1.1.1"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: ihh_a.naam_project
    - task: TOPdesk nummer (indien aanwezig)
      description: Het meldingsnummer van het IV-verzoek in ITS Topdesk, als dat al is uitgegeven.
      id: "1.1.2"
      type:
      - text_input
      repeatable: false
      required_status: false
      references:
        invulhulp: ihh_a.topdesk
    - task: Datum
      description: De datum waarop deze toets is ingevuld.
      id: "1.1.3"
      type:
      - date
      repeatable: false
      required_status: true
      references:
        invulhulp: ihh_a.datum
    - task: Opdrachtgever
      id: "1.1.4"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: ihh_a.opdrachtgever
    - task: Projectleider of contactpersoon
      id: "1.1.5"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: ihh_a.projectleider
  - task: Toelichting IV-verzoek
    description: >-
      Context die bepaalt welke eisen aan duurzame toegankelijkheid gelden: het proces, de bewaartermijn, de archiveringslocatie en de rubricering.
    id: "1.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Binnen welk(e) proces(sen) wordt de applicatie of het systeem ingezet?
      description: >-
        Geef hier aan binnen welk(e) proces(sen) de applicatie of het systeem gebruikt gaat worden. Bij voorkeur wordt hier ook een verwijzing gemaakt naar (een) proces(sen) binnen de Selectielijst van het ministerie van Financiën.
      id: "1.2.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: ihh_a.processen
    - task: >-
        Hoe lang zijn de overheidsinformatie/-gegevens die in de applicatie of het systeem opgeslagen worden te bewaren?
      description: >-
        Hoe lang overheidsinformatie/-gegevens bewaard moeten worden is vastgelegd in de selectielijst (zie: Selectielijst van het ministerie van Financiën). Informatie is óf permanent te bewaren, óf op termijn te vernietigen.
      id: "1.2.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: ihh_a.bewaartermijn
    - task: Waar vindt de archivering van deze overheidsinformatie/-gegevens plaats?
      description: Geef hier aan waar de overheidsinformatie/-gegevens, na creatie en/of gebruik, gearchiveerd worden.
      id: "1.2.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: In de beoogde applicatie of systeem
      - value: Ergens anders (bijvoorbeeld in Digidoc Online)
      - value: Nog niet bekend
      required_status: true
      references:
        invulhulp: ihh_a.archiveringslocatie
    - task: Toelichting
      description: Licht toe waar de overheidsinformatie/-gegevens, na creatie en/of gebruik, gearchiveerd worden.
      id: "1.2.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "1.2.3"
          operator: any
        action: show
    - task: Worden er gerubriceerde overheidsinformatie/-gegevens opgeslagen in de applicatie of het systeem?
      description: >-
        Gerubriceerde informatie vraagt vaak extra (beveiligings)maatregelen om deze veilig en duurzaam te kunnen bewaren.
      id: "1.2.4"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Nog niet bekend
      required_status: true
      references:
        invulhulp: ihh_a.gerubriceerd
    - task: Toelichting
      description: >-
        Geef toelichting bij antwoord — om welke rubricering gaat het en welke maatregelen zijn daarvoor voorzien?
      id: "1.2.4-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "1.2.4"
          operator: any
        action: show
- task: 'Deel B: Omgaan met overheidsinformatie en metadata'
  id: "2"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: Omgaan met overheidsinformatie
    description: Licht elk antwoord kort toe, ook wanneer 'Nee' of 'N.v.t. of onbekend' wordt gekozen.
    id: "2.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        1. Er worden (vastgelegde) afspraken gemaakt over hoe met overheidsinformatie/-gegevens wordt omgegaan of gewerkt in de applicatie of het systeem.
      description: >-
        Het maken van dergelijke (werk)afspraken is altijd belangrijk voor de duurzame toegankelijkheid van onze informatie, ook wanneer een nieuwe applicatie of systeem in gebruik genomen worden. Deze vraag omvat ook het maken van afspraken over het na gebruik verplaatsen van overheidsinformatie naar een ander systeem voor archivering.
      id: "2.1.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: true
      references:
        invulhulp: ihh_b.1
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "2.1.1-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.1.1"
          operator: any
        action: show
    - task: >-
        2. Er worden (vastgelegde) afspraken gemaakt over de structuur waarbinnen overheidsinformatie/-gegevens in de applicatie of het systeem worden opgeslagen.
      description: >-
        Het maken van dergelijke (werk)afspraken is altijd belangrijk voor de duurzame toegankelijkheid van onze informatie, ook wanneer een nieuwe applicatie of systeem in gebruik genomen worden. Hierbij kan gedacht worden aan een mappen- of dossierstructuur.
      id: "2.1.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: true
      references:
        invulhulp: ihh_b.2
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "2.1.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.1.2"
          operator: any
        action: show
  - task: Gebruik van metadata
    description: Deze categorie sluit aan bij het DUTO-kernproces 'Registreren'.
    id: "2.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        3. Het is mogelijk om in de applicatie of het systeem unieke identificatienummers toe te voegen aan documenten, mappen, en/of dossiers.
      description: >-
        Een uniek identificatienummer (zoals een uniek documentnummer) bevordert het kunnen terugvinden van onze overheidsinformatie.
      id: "2.2.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: false
      references:
        invulhulp: ihh_b.3
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "2.2.1-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.2.1"
          operator: any
        action: show
    - task: >-
        4. Het is mogelijk om overheidsinformatie/-gegevens in de applicatie of het systeem (handmatig of geautomatiseerd) te voorzien van metadata.
      description: >-
        Metadata zijn 'gegevens over gegevens': gegevens die andere gegevens beschrijven, verklaren of context geven. Het toekennen van metadata gebeurt bij voorkeur zoveel mogelijk geautomatiseerd; maar het kan ook een optie zijn om metadata handmatig toe te voegen.
      id: "2.2.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: true
      references:
        invulhulp: ihh_b.4
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "2.2.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.2.2"
          operator: any
        action: show
    - task: >-
        5. Er wordt voorafgaand aan het in gebruik nemen van de applicatie of het systeem bepaald welke metadata minimaal vastgelegd moet worden.
      description: >-
        (Tijdig) aandacht besteden aan metadatering is altijd belangrijk voor de duurzame toegankelijkheid van onze informatie, ook wanneer een nieuwe applicatie of systeem in gebruik genomen worden. Bij voorkeur wordt hier uitgegaan van een vastgesteld metagegevensschema.
      id: "2.2.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: true
      references:
        invulhulp: ihh_b.5
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "2.2.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.2.3"
          operator: any
        action: show
- task: 'Deel C: Opslaan, archiveren, migreren en vernietigen'
  id: "3"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: Overheidsinformatie opslaan en archiveren
