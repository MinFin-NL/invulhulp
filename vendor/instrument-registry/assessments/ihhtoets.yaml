      - value: N.v.t. of onbekend
      required_status: false
      references:
        invulhulp: ihh_b.13
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.2.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "3.2.3"
