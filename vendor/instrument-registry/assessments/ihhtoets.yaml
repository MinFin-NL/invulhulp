      - value: N.v.t. of onbekend
      required_status: true
      references:
        invulhulp: ihh_b.16
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "4.1.1-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "4.1.1"
          operator: any
        action: show
    - task: >-
