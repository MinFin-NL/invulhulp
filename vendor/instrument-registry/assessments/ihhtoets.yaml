        action: show
  - task: Vernietigen van overheidsinformatie
    description: Deze categorie sluit aan bij het DUTO-kernproces 'Vernietigen'.
    id: "3.3"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        14. Het is mogelijk om overheidsinformatie/-gegevens in de applicatie of het systeem die in aanmerking komen voor vernietiging te markeren, of hiervan een overzicht te genereren.
      description: >-
        Overheidsinformatie/-gegevens waarvan de bewaartermijn (op basis van de selectielijst) is verstreken, komen in aanmerking voor vernietiging.
