        Hoe lang overheidsinformatie bewaard moet worden is vastgelegd in de selectielijst. Aan deze vraag kan op verschillende manieren invulling gegeven worden, bijvoorbeeld door het toevoegen van metadata of door dit vast te (laten) leggen in het Informatiebeheerplan (IBP).
      id: "3.1.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: true
      references:
        invulhulp: ihh_b.7
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.1.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "3.1.2"
          operator: any
        action: show
    - task: >-
        8. Het is mogelijk om overheidsinformatie/-gegevens (en de bijbehorende metagegevens) in de applicatie of het systeem onveranderlijk te maken, zodat deze niet meer kunnen worden gewijzigd.
      description: >-
        Een manier om hier invulling aan te geven is door de informatie/gegevens op 'Alleen lezen' te kunnen zetten.
