          operator: any
        action: show
    - task: >-
        12. Het is mogelijk om overheidsinformatie/-gegevens, inclusief de bijbehorende metadata, uit de applicatie of het systeem te migreren of verplaatsen naar een andere applicatie.
      description: >-
        Het kunnen migreren of verplaatsen van overheidsinformatie is vooral van belang wanneer de archivering van de informatie elders plaatsvindt, bijvoorbeeld in Digidoc Online.
      id: "3.2.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: false
      references:
        invulhulp: ihh_b.12
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.2.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
