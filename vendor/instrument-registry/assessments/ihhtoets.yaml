      required_status: false
      references:
        invulhulp: ihh_b.14
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.3.1-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "3.3.1"
          operator: any
        action: show
    - task: >-
        15. Het is mogelijk om overheidsinformatie/-gegevens in de applicatie of het systeem (onherstelbaar) te vernietigen.
      description: >-
        Bij voorkeur is het mogelijk een rapport te genereren van de vernietigingsacties die zijn uitgevoerd. Deze vraag omvat ook het vernietigen van de overheidsinformatie/-gegevens uit eventuele back-ups van de applicatie of het systeem.
      id: "3.3.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: false
      references:
        invulhulp: ihh_b.15
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.3.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "3.3.2"
          operator: any
        action: show
- task: 'Deel D: Toegang tot overheidsinformatie'
  id: "4"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: Toegang tot overheidsinformatie
    description: Deze categorie sluit aan bij het DUTO-kernproces 'Ter beschikking stellen'.
    id: "4.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        16. Het is mogelijk om, door middel van een zoekfunctionaliteit, de overheidsinformatie/-gegevens in de applicatie of het systeem te doorzoeken.
      id: "4.1.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
