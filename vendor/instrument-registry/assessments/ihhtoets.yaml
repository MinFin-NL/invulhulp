      required_status: false
      references:
        invulhulp: ihh_b.8
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.1.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "3.1.3"
          operator: any
        action: show
    - task: >-
        9. De overheidsinformatie/-gegevens in de applicatie of het systeem worden opgeslagen in duurzame bestandsformaten.
      description: Zie de Lijst voorkeursformaten van het Nationaal Archief.
      id: "3.1.4"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: false
      references:
        invulhulp: ihh_b.9
    - task: Toelichting
      description: Geef toelichting bij antwoord…
      id: "3.1.4-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "3.1.4"
          operator: any
        action: show
    - task: 10. Het is mogelijk om overheidsinformatie/-gegevens te converteren naar een ander bestandsformaat.
      description: '''Converteren'' is het omzetten van informatie/gegevens naar een ander (bestands)formaat.'
      id: "3.1.5"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t. of onbekend
      required_status: false
      references:
        invulhulp: ihh_b.10
    - task: Toelichting
      description: Geef toelichting bij antwoord…
