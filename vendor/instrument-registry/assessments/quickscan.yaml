- task: Resultaat, risico en maatregelen
  id: "4"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: 5. Classificatie van het proces
    id: "4.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welke procesklasse hoort bij dit proces?
      description: >-
        Ondersteunend: geen directe relatie met de producten of diensten waaraan de organisatie haar bestaansrecht ontleent. Bijdragend: indirecte relatie, het ontbreken ervan geeft effectiviteits- en efficiencyverlies in het primaire proces. Strategisch: directe relatie met de doelstellingen van de organisatie. Kritisch strategisch: het proces speelt een primaire rol voor de doelstelling; langdurige uitval brengt de organisatie in een hachelijke positie.
      id: "4.1.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ondersteunend — gewenst proces, MTU meer dan 2 weken
      - value: Bijdragend — noodzakelijk proces, MTU meer dan 1 week
      - value: Strategisch — vitaal proces, MTU meer dan 48 uur
      - value: Kritisch strategisch — tijdkritiek proces, MTU meer dan 24 uur
      required_status: true
      references:
        invulhulp: qs_d.procesklasse
    - task: Toelichting op de procesklasse
      id: "4.1.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_d.procesklasse_toelichting
  - task: 6. Classificatie van het informatiesysteem
    id: "4.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welke klasse hoort bij het informatiesysteem?
      description: >-
        Nuttig: het systeem ondersteunt het bedrijfsproces en is handig om te hebben. Belangrijk: het levert een belangrijke bijdrage, voortzetting van het proces zonder het systeem kost onevenredig veel inspanning, het verhoogt effectiviteit en efficiëntie, of het wordt door veel medewerkers of burgers gebruikt. Vitaal: het uitvoeren van de bedrijfsprocessen is zonder het systeem (nagenoeg) onmogelijk.
      id: "4.2.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Nuttig
      - value: Belangrijk
      - value: Vitaal
      required_status: true
      references:
        invulhulp: qs_d.systeemklasse
    - task: Argumentatie bij de systeemklasse
      id: "4.2.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_d.systeemklasse_argumentatie
  - task: 7. Zijn aanvullende maatregelen noodzakelijk?
    description: >-
      Wordt één van deze vragen met Ja beantwoord, dan krijgt het systeem altijd de classificatie HOOG en moeten er op basis van een risicoanalyse aanvullende maatregelen bovenop de BIO2-maatregelen worden gedefinieerd om de cyberdreiging te reduceren.
    id: "4.3"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: 1. Is er weerstand vereist tegen statelijke actoren?
      id: "4.3.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_d.statelijke_actoren
    - task: >-
        2. Heeft de ontvangen informatie een classificatie of rubricering meegekregen van de (externe) bronhouder?
      description: Bijvoorbeeld een EU- of NAVO-rubricering.
      id: "4.3.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_d.externe_rubricering
    - task: 3. Is er weerstand nodig tegen georganiseerde misdaad en zware criminaliteit?
      id: "4.3.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_d.georganiseerde_misdaad
    - task: 'Conclusie: zijn aanvullende maatregelen bovenop de BIO2-baseline noodzakelijk?'
      id: "4.3.4"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Nader te bepalen
      required_status: true
      references:
        invulhulp: qs_d.extra_maatregelen
    - task: Toelichting op de aanvullende maatregelen
      id: "4.3.5"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_d.extra_maatregelen_toelichting
  - task: Privacy en DPIA-screening
    description: >-
      Persoonsgegevens bepalen mede de vertrouwelijkheidsclassificatie en de vraag of een DPIA verplicht is.
    id: "4.4"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Worden er persoonsgegevens verwerkt?
      id: "4.4.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_d.persoonsgegevens
    - task: Worden er bijzondere persoonsgegevens verwerkt (artikel 9 AVG)?
      description: >-
        Bijvoorbeeld BSN, godsdienst of levensovertuiging, ras, politieke gezindheid, medische gegevens of strafrechtelijke gegevens.
      id: "4.4.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Niet van toepassing
      required_status: true
      references:
        invulhulp: qs_d.bijzondere_persoonsgegevens
    - task: Welke (bijzondere) persoonsgegevens worden verwerkt?
      description: >-
        Beschrijf welke persoonsgegevens worden verwerkt en in welke context. Bijvoorbeeld naam, adres en woonplaats, telefoonnummers of postcodes met huisnummers.
      id: "4.4.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_d.persoonsgegevens_toelichting
    - task: Is een DPIA noodzakelijk op basis van deze scan?
      description: >-
        Of een volledige DPIA verplicht is, volgt uit de prescan DPIA. Deze vraag legt vast wat deze classificatietoets daarover signaleert.
      id: "4.4.4"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja — DPIA is verplicht
      - value: Nee — geen DPIA vereist
      - value: Nader te bepalen
      required_status: true
      references:
        invulhulp: qs_d.dpia_noodzakelijk
  - task: Risiconiveau in context
    description: >-
      Ondergrens: de BIO2-overheidsmaatregelen (deel 2) zijn wettelijk verplicht voor alle overheidsorganisaties, ongeacht het risiconiveau. Cbw- en Cbb-maatregelen zijn aanvullend verplicht voor Cbw-entiteiten. Eigen aanvullende maatregelen zijn bindend via het organisatiebeleid (ISMS, BIO2 §5).
    id: "4.5"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welk risiconiveau volgt uit de classificatie?
      description: >-
        Staat één of meer van de drie aspecten op Hoog, dan is een diepgaande risicoanalyse het advies. Risicoacceptatie na een bewuste, gedocumenteerde proportionaliteitsafweging is een volwaardige keuze voor ISO- en organisatie-eigen maatregelen; voor BIO2-overheidsmaatregelen nooit.
      id: "4.5.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: '1 — Zeer laag: BIO2-overheidsmaatregelen voldoende'
      - value: '2 — Laag: BIO2 + eigen maatregelen voldoende'
      - value: '3 — Gemiddeld: BIO2 + eigen maatregelen voldoende, aanvullende risicoanalyse overwegen'
      - value: '4 — Hoog: aanvullende risicoanalyse vereist'
      - value: '5 — Extreem: aanvullende risicoanalyse vereist, escaleren naar CISO en management'
      required_status: true
      references:
        invulhulp: qs_d.risiconiveau
    - task: Welke vervolgstappen zijn afgesproken?
      description: >-
        Bij 'aanvullende risicoanalyse vereist': start de risicoanalyse, rapporteer de uitkomst aan het management, registreer het risico in het risicoacceptatieformulier of risicoregister en leg de verbetermaatregelen vast met een streefdatum.
      id: "4.5.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_d.vervolgstappen
