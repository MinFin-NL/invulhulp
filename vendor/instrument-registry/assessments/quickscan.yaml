      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_b.b1_argumentatie
    - task: >-
        B2 Imagoverlies — Hoe lang duurt het voordat er sprake is van imagoverlies wanneer de informatie niet voorhanden is?
      description: >-
        Imagoverlies is lastig in te schatten omdat er soms veel tijd is voor bepaalde beslissingen. Bedenk wel dat er soms een wettelijke maximumtermijn is waarbinnen informatie beschikbaar moet zijn.
      id: "3.1.3"
      type:
