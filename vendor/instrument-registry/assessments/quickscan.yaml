      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Catastrofaal — Uren
      - value: Kritiek/Zeer ernstig — Dag (deel)
      - value: Gemiddeld — Week
      - value: Gering — Meer dan een week
      - value: Verwaarloosbaar — Meer dan 2 weken
      required_status: true
      references:
        invulhulp: qs_b.b1
    - task: Argumentatie bij B1
      description: >-
        Verplicht: leg vast waarom deze waardering is gekozen, zodat iemand die de toets later herhaalt de keuze kan volgen.
