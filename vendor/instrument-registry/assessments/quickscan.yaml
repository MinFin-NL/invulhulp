  - task_group
  repeatable: false
  tasks:
  - task: Beschikbaarheid
    description: >-
      Gevolgen van het niet beschikbaar hebben van de benodigde informatie of gegevens, in het ergste geval. Kies per vraag één antwoord en vul altijd de argumentatie in.
    id: "3.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        B1 Managementbeslissingen — Welke tijdsduur, waarin het nemen van beslissingen door het ontbreken van informatie negatief wordt beïnvloed, is acceptabel?
