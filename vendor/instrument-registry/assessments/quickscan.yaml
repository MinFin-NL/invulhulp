# yaml-language-server: $schema=../schemas/assessment-definition.v2.schema.json

name: Quickscan BIO2 – Classificatietoets
urn: urn:nl:minfin:ir:quickscan:2.0
version: '2.0'
description: >-
  De Quickscan BIO2 bepaalt de classificatie van informatie op beschikbaarheid, integriteit en vertrouwelijkheid conform de Baseline Informatiebeveiliging Overheid versie 2. De uitkomst geeft aan welk beschermingsniveau vereist is, of een aanvullende risicoanalyse of DPIA nodig is, en welke BIO2-maatregelen van toepassing zijn. Er wordt gestreefd naar een zo laag mogelijk classificatieniveau: te hoog classificeren leidt tot onnodige kosten.

  Bron: Classificatietoets BIO2 — dataclassificatie op beschikbaarheid, integriteit en vertrouwelijkheid (Ministerie van Financiën, op basis van de IBD-handreiking dataclassificatie bij de Baseline Informatiebeveiliging Overheid versie 2, versie QIS BIO2 MinFin v1.0 — 10-07-2026). Veldgetrouw overgezet uit de werkmap 'QIS BIO2 MinFin v1.0 - 10072026.xlsx'. De rekenformules van de werkmap (maximumwaarde per aspect, risiconiveau, quantumresultaat) zijn hier invulvelden: de invuller neemt de hoogste waardering zelf over. De maatregelentabbladen zijn een selectie van toepasselijke BIO2-controls, geen in-controlverklaring.
tasks:
- task: Algemeen
  id: "1"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: 0. Basisgegevens
    description: >-
      Vul de basisgegevens in over het proces of informatiesysteem waarvoor de classificatietoets BIO2 wordt uitgevoerd.
    id: "1.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Directie
      id: "1.1.1"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.organisatie
    - task: Afdeling of team
      id: "1.1.2"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.afdeling
    - task: Naam van het proces of informatiesysteem
      description: 'Het object van de classificatie: het bedrijfsproces, de applicatie of het informatiesysteem.'
      id: "1.1.3"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.systeemnaam
    - task: Naam en functie opsteller
      id: "1.1.4"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.opsteller
    - task: Versienummer
      id: "1.1.5"
      type:
      - text_input
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.versienummer
    - task: Datum van de classificatietoets
      id: "1.1.6"
      type:
      - date
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.datum
  - task: 1. Managementsamenvatting
    id: "1.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Managementsamenvatting
      description: >-
        Vat in het kort samen wat er is getoetst en wat de uitkomst is. Vul dit als laatste in, als de classificatie bekend is.
      id: "1.2.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.managementsamenvatting
  - task: 2. Inleiding
    id: "1.3"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Waarom wordt deze Quickscan BIO2 uitgevoerd?
      id: "1.3.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.aanleiding
    - task: Wie voert de classificatietoets uit?
      id: "1.3.2"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.uitvoerder
    - task: Zijn er bijzonderheden bij de uitvoering van deze toets?
      description: Bijvoorbeeld informatie die nog niet beschikbaar is, of aannames die zijn gedaan.
      id: "1.3.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.bijzonderheden
    - task: Projectsamenvatting
      description: Korte beschrijving van het project of de wijziging waarbinnen dit proces of systeem wordt gebruikt.
      id: "1.3.4"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.projectsamenvatting
  - task: 2.2 – 2.8 Relatie met andere producten en toetsen
    description: >-
      Deze classificatietoets bouwt voort op eerder uitgevoerde toetsen. Verwijs per onderdeel naar het document en neem de uitkomst over.
    id: "1.4"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: 'Programma Start Architectuur (PSA): verwijzing en uitkomst'
      description: Verwijs naar de PSA en beschrijf welke architectuurkaders relevant zijn voor deze classificatie.
      id: "1.4.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_a.psa
    - task: Is er eerder een IB-quickscan of classificatietoets uitgevoerd?
      id: "1.4.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Onbekend
      required_status: true
      references:
        invulhulp: qs_a.ib_quickscan_eerder
    - task: Verwijzing naar de eerdere IB-quickscan en de eerdere dataclassificatie
      id: "1.4.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.ib_quickscan_uitkomst
      dependencies:
      - type: conditional
        condition:
          id: "1.4.2"
          operator: equals
          value: Ja
        action: show
    - task: Is er eerder een BIA uitgevoerd?
      id: "1.4.4"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Onbekend
      required_status: true
      references:
        invulhulp: qs_a.bia_uitgevoerd
    - task: Verwijzing naar de BIA en de uitkomsten daarvan
      id: "1.4.5"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.bia_uitkomst
      dependencies:
      - type: conditional
        condition:
          id: "1.4.4"
          operator: equals
          value: Ja
        action: show
    - task: Is het proces of de applicatie vastgesteld als TBB (te beschermen belang)?
      id: "1.4.6"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Onbekend
      required_status: true
      references:
        invulhulp: qs_a.tbb
    - task: Verwijzing naar de TBB-toets en de resulterende TBB-classificatie
      id: "1.4.7"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.tbb_uitkomst
      dependencies:
      - type: conditional
        condition:
          id: "1.4.6"
          operator: equals
          value: Ja
        action: show
    - task: Wat is de rubricering van dit proces of deze informatie?
      description: >-
        De rubricering volgt uit het VIR-BI / de Rijksbrede rubriceringsregels en is iets anders dan de vertrouwelijkheidsclassificatie in deel C.
      id: "1.4.8"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ongerubriceerd
      - value: Departementaal Vertrouwelijk (Dep.V)
      - value: Staatsgeheim Confidentieel
      - value: Staatsgeheim Geheim
      - value: Staatsgeheim Zeer Geheim
      required_status: true
      references:
        invulhulp: qs_a.rubricering
    - task: Is er een prescan DPIA uitgevoerd?
      id: "1.4.9"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Onbekend
      required_status: true
      references:
        invulhulp: qs_a.prescan_dpia
    - task: Verwijzing naar de (pre)DPIA en de uitkomsten daarvan
      id: "1.4.10"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.prescan_dpia_uitkomst
      dependencies:
      - type: conditional
        condition:
          id: "1.4.9"
          operator: equals
          value: Ja
        action: show
    - task: Betreft het een applicatie in de cloud?
      id: "1.4.11"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Onbekend
      required_status: true
      references:
        invulhulp: qs_a.cloud
    - task: Toelichting op de cloudoplossing en de uitkomst van de cloudtoets
      id: "1.4.12"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_a.cloud_uitkomst
      dependencies:
      - type: conditional
        condition:
          id: "1.4.11"
          operator: equals
          value: Ja
        action: show
- task: Proces en informatiesysteem
  id: "2"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: 3.1 Geïnterviewden en eigenaarschap
    description: >-
      De informatie-eigenaar moet in deze fase bekend zijn: die stelt de classificatie vast en is verantwoordelijk voor de te nemen beveiligingsmaatregelen.
    id: "2.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Wie is geïnterviewd voor deze quickscan?
      id: "2.1.1"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.geinterviewde
    - task: Wie is de proceseigenaar?
      id: "2.1.2"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.proceseigenaar
    - task: Wie is de business owner?
      id: "2.1.3"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.businessowner
  - task: 3.2 – 3.3 Proces en procesbeschrijving
    id: "2.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Functie van het proces waarin de informatie wordt gebruikt
      id: "2.2.1"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.procesfunctie
    - task: Geef een bondige beschrijving van het proces en de informatie
      description: Benoem daarbij ook de proces- en informatie-eigenaar.
      id: "2.2.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.procesbeschrijving
    - task: Bijlagen
      id: "2.2.2-bijlagen"
      type:
      - task_group
      repeatable: true
      item_name: bijlage
      tasks:
      - task: Bijlage
        description: Upload een afbeelding. Optioneel kan je een titel, omschrijving en bron toevoegen.
        id: "2.2.2-bijlagen.1"
        type:
        - image
        repeatable: false
    - task: Benoem het hoofdproces en alle subprocessen
      id: "2.2.3"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.hoofd_en_subprocessen
    - task: Betreft het 24/7-dienstverlening, of is er in bepaalde perioden hoge beschikbaarheid nodig?
      description: >-
        Denk aan piekmomenten zoals een aangiftecampagne of een betaalrun: dan gelden vaak strengere eisen dan de rest van het jaar.
      id: "2.2.4"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.beschikbaarheidsvenster
  - task: 3.4 Ketens en ketenpartners
    description: Maakt het proces deel uit van een of meer ketens, of zijn anderen afhankelijk van deze informatie?
    id: "2.3"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Van welke keten(s) maakt het proces deel uit?
      id: "2.3.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.ketens
    - task: Wie zijn de ketenpartners?
      description: Welke externe partijen zijn betrokken bij of afhankelijk van dit proces of systeem?
      id: "2.3.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.ketenpartners
    - task: Bijlagen
      id: "2.3.2-bijlagen"
      type:
      - task_group
      repeatable: true
      item_name: bijlage
      tasks:
      - task: Bijlage
        description: Upload een afbeelding. Optioneel kan je een titel, omschrijving en bron toevoegen.
        id: "2.3.2-bijlagen.1"
        type:
        - image
        repeatable: false
  - task: 3.5 Subprocessen en activiteiten
    id: "2.4"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welke subprocessen zijn te onderscheiden?
      id: "2.4.1"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: qs_c.subprocessen
    - task: Welke hoofdactiviteiten worden binnen het proces uitgevoerd en wie voeren die uit?
      id: "2.4.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.hoofdactiviteiten
  - task: 3.6 Type informatie
    id: "2.5"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welke informatie wordt gebruikt binnen het proces en de subprocessen?
      description: >-
        Bijvoorbeeld financiële gegevens, aanslaggegevens of bedrijfsgegevens. Persoonsgegevens komen in deel D aan bod.
      id: "2.5.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.informatiesoorten
  - task: 3.7 – 3.8 Afnemers en leveranciers van informatie
    id: "2.6"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welke afnemers van informatie heeft het proces, en welke informatie nemen zij af?
      id: "2.6.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.afnemers
    - task: Welke kwaliteitseisen stellen de afnemers aan deze informatie?
      id: "2.6.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.afnemers_eisen
    - task: Welke leveranciers van informatie heeft het proces, en welke informatie leveren zij aan?
      id: "2.6.3"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.leveranciers
    - task: Welke eisen stellen zij aan de informatie die in het proces wordt gebruikt?
      id: "2.6.4"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.leveranciers_eisen
  - task: 3.9 Wet- en regelgeving
    id: "2.7"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Welke wet- en regelgeving is van toepassing op deze informatie en dit proces?
      description: Bijvoorbeeld AVG, Archiefwet, Cyberbeveiligingswet (Cbw), sectorspecifieke wetgeving.
      id: "2.7.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.wetgeving
    - task: Welke specifieke eisen komen daaruit voort?
      description: Bijvoorbeeld een verplichte (pre)DPIA, een AIIA of een bewaartermijn.
      id: "2.7.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.wetgeving_eisen
  - task: 4. Vragenlijst informatiesysteem
    id: "2.8"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Door welke informatievoorziening of systemen wordt de informatie verwerkt?
      description: Welke systemen of applicaties worden ingezet voor dit proces?
      id: "2.8.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.systemen_beschrijving
    - task: Bijlagen
      id: "2.8.1-bijlagen"
      type:
      - task_group
      repeatable: true
      item_name: bijlage
      tasks:
      - task: Bijlage
        description: Upload een afbeelding. Optioneel kan je een titel, omschrijving en bron toevoegen.
        id: "2.8.1-bijlagen.1"
        type:
        - image
        repeatable: false
    - task: Wie is de (beoogd) eigenaar van de informatie?
      description: >-
        Let op: de eigenaar moet in deze fase bekend zijn of benoemd worden — die stelt de classificatie vast.
      id: "2.8.2"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.informatie_eigenaar
    - task: Wie is de informatiesysteemeigenaar?
      id: "2.8.3"
      type:
      - text_input
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.systeemeigenaar
    - task: Wie zijn de gebruikers van het informatiesysteem?
      id: "2.8.4"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.gebruikers
    - task: Wat voor soort systeem betreft het?
      description: Bijvoorbeeld maatwerk, standaardpakket, SaaS-dienst of koppelvlak.
      id: "2.8.5"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.systeemsoort
    - task: Wat is de output van het informatiesysteem?
      id: "2.8.6"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.output
    - task: Zijn er koppelvlakken met andere informatiesystemen? Zo ja, welke?
      id: "2.8.7"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.koppelvlakken
    - task: Bijlagen
      id: "2.8.7-bijlagen"
      type:
      - task_group
      repeatable: true
      item_name: bijlage
      tasks:
      - task: Bijlage
        description: Upload een afbeelding. Optioneel kan je een titel, omschrijving en bron toevoegen.
        id: "2.8.7-bijlagen.1"
        type:
        - image
        repeatable: false
    - task: Hoe kan de informatie of data zich verplaatsen?
      description: Denk aan export, koppelvlakken, back-ups, e-mail en meegenomen apparatuur.
      id: "2.8.8"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.dataverplaatsing
    - task: Hoe kan de informatie gemuteerd of aangepast worden, en hoe krijgt iemand autorisatie?
      id: "2.8.9"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.mutatie_autorisatie
    - task: Hoe ziet de roadmap eruit die aangeeft hoe en wanneer het systeem quantumveilig wordt?
      description: 'Bijvoorbeeld: geen roadmap, hoog-over of gedetailleerd.'
      id: "2.8.10"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.quantum_roadmap
    - task: Hoe geeft het systeem inzicht in de softwarematige en cryptografische afhankelijkheden?
      description: Bijvoorbeeld via een SBOM of CBOM.
      id: "2.8.11"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.crypto_inzicht
    - task: Hoe wordt crypto-agility meegenomen in het systeem?
      description: Bijvoorbeeld via de architectuur of via een handmatig overzicht van gebruikte algoritmen.
      id: "2.8.12"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: qs_c.crypto_agility
  - task: 4.9 Quantumveiligheid
    description: >-
      Vragen over de quantumveiligheid van de informatie. Dit raakt zowel de vertrouwelijkheid, de integriteit als de beschikbaarheid. Beantwoord alle vragen; licht toe wat nog niet volledig te beantwoorden is en kom daarop terug zodra de informatie beschikbaar is.
    id: "2.9"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Q1 Informatietransport — wordt het communicatiekanaal beschermd met versleuteling?
      id: "2.9.1"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_c.q1_informatietransport
    - task: >-
        Q2 Transportmiddel — wordt voor de versleuteling van het communicatiekanaal iets anders dan TLS, IPsec of SSH gebruikt?
      id: "2.9.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_c.q2_transportmiddel
    - task: Q3 TLS-versie — wordt voor de versleuteling een quantumveilige methode ondersteund?
      description: Als OpenSSL wordt gebruikt is minimaal versie 3.5 nodig.
      id: "2.9.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      required_status: true
      references:
        invulhulp: qs_c.q3_tls_versie
    - task: >-
        Q4 Quantumveilig certificaat — wordt voor de authenticatie een quantumveilig certificaat ondersteund?
      id: "2.9.4"
