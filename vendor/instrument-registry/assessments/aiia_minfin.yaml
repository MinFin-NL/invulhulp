# yaml-language-server: $schema=../schemas/assessment-definition.v2.schema.json

name: AI Impact Assessment (MinFin)
urn: urn:nl:minfin:ir:aiia:2.1
version: '2.1'
description: >-
  Het AI Impact Assessment (AIIA) helpt medewerkers van MinFin om op een gestructureerde manier te beoordelen of het verantwoord is een AI-systeem in te zetten, en hoe dit systeem verantwoord geïmplementeerd en gebruikt kan worden.

  Bron: AI Impact Assessment (AIIA) 2.0 (Ministerie van Financiën, versie 2.0). https://www.rijksoverheid.nl/documenten/rapporten/2022/11/30/ai-impact-assessment-ministerie-van-infrastructuur-en-waterstaat Bron is het AI Impact Assessment 2.0 van het Ministerie van Infrastructuur en Waterstaat (PDF, december 2024); de officiele Invultemplate-AIIA2.0.docx van het Algoritmekader is de invulvorm daarvan. De 110 vragen en hun verplicht/hulpvraag-indeling (34 blauw, 76 groen) zijn ongewijzigd overgenomen. Eigen toevoegingen van MinFin, niet afkomstig uit het IenW-format: 1.1.4 (aanleiding), 1.1.5 (verwachte voordelen), 1.1.6 (termijn en looptijd) en 3.3 (conclusie; stuurt de beslispoort naar deel B aan en is daarom verplicht, hoewel de bron hier geen vraag stelt). Bijlage 1 van de bron is vervangen door de MinBZK-beslishulp AI-verordening (zie vendor/ai-verordening-beslishulp); Bijlage 2 wordt gedekt door euaiact; Bijlage 3 (generatieve AI) is nog niet verwerkt. Niet gegenereerd uit par-dpia-form en losstaand van de vendored IAMA.
tasks:
- task: 'Deel A: Afweging'
  id: "1"
  type:
  - task_group
  repeatable: false
  tasks:
  - task: 1.1 Doel van het systeem
    description: Beschrijf het doel en de noodzaak van het AI-systeem dat u wilt inzetten.
    id: "1.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Geef een beknopte beschrijving van het beoogde doel en de verwachte resultaten van het AI-systeem.
      id: "1.1.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 1.1.1
    - task: >-
        In welke risicocategorie van de AI-verordening valt het systeem (onaanvaardbaar, hoog, beperkt, minimaal)?
      description: Zie Bijlage 1 voor de risicoclassificatie. Vul dit in nadat u Bijlage 1 heeft ingevuld.
      id: "1.1.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Onaanvaardbaar risico
      - value: Hoog risico
      - value: Beperkt risico
      - value: Minimaal risico
      - value: Nog niet bepaald
      required_status: true
      references:
        invulhulp: 1.1.2
    - task: Toelichting
      description: Licht uw antwoord toe.
      id: "1.1.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "1.1.2"
          operator: any
        action: show
    - task: Waar in de organisatie wordt het systeem ingezet (afdeling, proces, werkzaamheden)?
      id: "1.1.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.1.3
    - task: Wat is de aanleiding voor de inzet van dit AI-systeem?
      description: Beschrijf welk probleem of welke behoefte ten grondslag ligt aan de keuze voor dit systeem.
      id: "1.1.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.1.4
    - task: Wat zijn de verwachte voordelen van het gebruik van dit AI-systeem?
      id: "1.1.5"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.1.5
    - task: Op welke termijn wordt het systeem ingezet en wat is de geplande looptijd?
      id: "1.1.6"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.1.6
  - task: 1.2 Beoogde oplossing
    description: Beschrijf de technische oplossing en de overwegingen daarbij.
    id: "1.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Geef een beschrijving van het AI-systeem (techniek, data, type algoritme).
      description: >-
        Beschrijf welk type AI-systeem wordt gebruikt (machine learning, regelgebaseerd, generatief AI, etc.), welke data als input dient en welk type output het systeem produceert.
      id: "1.2.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 1.2.1
    - task: Bijlagen
      id: "1.2.1-bijlagen"
      type:
      - task_group
      repeatable: true
      item_name: bijlage
      tasks:
      - task: Bijlage
        description: Upload een afbeelding. Optioneel kan je een titel, omschrijving en bron toevoegen.
        id: "1.2.1-bijlagen.1"
        type:
        - image
        repeatable: false
    - task: Waarom is voor deze vorm van AI gekozen?
      description: Motiveer de keuze voor AI ten opzichte van niet-AI-alternatieven.
      id: "1.2.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 1.2.2
    - task: Welke alternatieven zijn overwogen (inclusief niet-AI-oplossingen)?
      id: "1.2.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.2.3
  - task: 1.3 Rol binnen de organisatie
    description: Beschrijf de rolverdeling en betrokken partijen.
    id: "1.3"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Hoe is de rolverdeling geregeld (ontwikkelaar, opdrachtgever, projectleider, beheerders)?
      description: Benoem de namen of functies van de betrokkenen en hun verantwoordelijkheden.
      id: "1.3.1"
      type:
      - task_group
      repeatable: true
      required_status: true
      references:
        invulhulp: 1.3.1
      tasks:
      - task: Rol
        description: bijv. ontwikkelaar, opdrachtgever, projectleider, beheerder
        id: "1.3.1.1"
        type:
        - text_input
        repeatable: false
        references:
          invulhulp: 1.3.1.rol
      - task: Naam of functie
        id: "1.3.1.2"
        type:
        - text_input
        repeatable: false
        references:
          invulhulp: 1.3.1.naam
      - task: Verantwoordelijkheden
        id: "1.3.1.3"
        type:
        - text_input
        repeatable: false
        references:
          invulhulp: 1.3.1.verantwoordelijkheden
    - task: Wie zijn de gebruikers en betrokkenen (degenen die de output van het systeem ondervinden)?
      id: "1.3.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 1.3.2
    - task: Welke stakeholders zijn geconsulteerd bij de ontwikkeling of aanschaf van het systeem?
      id: "1.3.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.3.3
    - task: >-
        Welke feedback is verzameld van diverse groepen, inclusief kwetsbare of ondervertegenwoordigde groepen?
      id: "1.3.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.3.4
  - task: 1.4 Onderhoud en beheer
    description: Beschrijf hoe het systeem beheerd en onderhouden wordt.
    id: "1.4"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Hoe is de rolverdeling voor het onderhoud en beheer van het systeem geregeld?
      id: "1.4.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 1.4.1
    - task: Hoe wordt omgegaan met wijzigingen in wet- en regelgeving die het systeem raken?
      id: "1.4.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 1.4.2
    - task: Is de benodigde expertise voor onderhoud en beheer gedocumenteerd en geborgd?
      id: "1.4.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Gedeeltelijk
      - value: N.v.t.
      required_status: false
      references:
        invulhulp: 1.4.3
    - task: Toelichting
      description: Licht toe hoe de expertise is geborgd of welke stappen worden genomen.
      id: "1.4.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "1.4.3"
          operator: any
        action: show
    - task: Hoe wordt omgegaan met veranderingen in de context waarbinnen het systeem wordt ingezet?
      description: Denk aan organisatorische veranderingen, wijziging van werkprocessen, of nieuwe gebruikersgroepen.
      id: "1.4.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 1.4.4
  - task: 2.1 Grondrechten
    description: Beoordeel de mogelijke impact op grondrechten van burgers.
    id: "1.5"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Wat is de mogelijke impact van het AI-systeem op grondrechten van burgers?
      description: >-
        Denk aan privacy, non-discriminatie, vrijheid van meningsuiting, recht op een eerlijk proces, en toegang tot diensten.
      id: "1.5.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 2.1.1
    - task: Wat is de wettelijke grondslag voor de inzet van het AI-systeem?
      id: "1.5.2"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 2.1.2
    - task: Welke grondrechtelijke bepalingen zijn van toepassing op dit systeem?
      id: "1.5.3"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 2.1.3
    - task: Welke rechten kunnen worden geschonden als het systeem niet correct functioneert?
      id: "1.5.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 2.1.4
  - task: 2.2 Duurzaamheid
    description: Beoordeel de milieu-impact van het AI-systeem.
    id: "1.6"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        Wat is de milieu-impact van het AI-systeem (ontwikkeling, installatie, gebruik) en hoe wordt dit gemeten?
      description: Denk aan energieverbruik, CO₂-uitstoot en gebruik van schaarse materialen.
      id: "1.6.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 2.2.1
    - task: Welke maatregelen worden getroffen om de negatieve milieu-impact te minimaliseren?
      id: "1.6.2"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 2.2.2
  - task: 2.3 Overige effecten
    description: Beschrijf overige maatschappelijke effecten van het AI-systeem.
    id: "1.7"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Hoe draagt het AI-systeem bij aan de missie van de organisatie?
      id: "1.7.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 2.3.1
    - task: >-
        Zijn er overige positieve of negatieve effecten voor specifieke groepen of de samenleving als geheel?
      description: Denk aan werkgelegenheid, toegankelijkheid, sociale cohesie of ongelijkheid.
      id: "1.7.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 2.3.2
  - task: 3. Afweging
    description: >-
      Maak een expliciete afweging over de inzet van het AI-systeem op basis van proportionaliteit en subsidiariteit.
    id: "1.8"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: >-
        Is de impact van het AI-systeem proportioneel ten opzichte van de doelstellingen en zijn er minder ingrijpende alternatieven?
      description: >-
        Proportionaliteit: weeg de voordelen af tegen de risico's en nadelen. Subsidiariteit: is er een minder ingrijpend alternatief dat hetzelfde doel bereikt?
      id: "1.8.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: '3.1'
    - task: Welke aanvullende maatregelen kunnen worden getroffen om verantwoord gebruik te waarborgen?
      id: "1.8.2"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: '3.2'
    - task: 'Conclusie: wordt het AI-systeem ingezet?'
      id: "1.8.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja, het systeem wordt ingezet
      - value: Nee, het systeem wordt niet ingezet
      required_status: true
      references:
        invulhulp: '3.3'
    - task: Toelichting
      description: Motiveer uw beslissing.
      id: "1.8.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "1.8.3"
          operator: any
        action: show
- task: 'Deel B: Implementatie en gebruik AI-systeem'
  id: "2"
  type:
  - task_group
  repeatable: false
  dependencies:
  - type: conditional
    condition:
      id: "1.8.3"
      operator: equals
      value: Ja, het systeem wordt ingezet
    action: show
  tasks:
  - task: 4.1 Bias
    description: Beschrijf hoe ongewenste bias in het AI-systeem wordt voorkomen en beheersed.
    id: "2.1"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Hoe wordt omgegaan met ongewenste bias (in input, model en output)?
      description: 'Beschrijf de maatregelen voor elk van de drie fasen: inputdata, het model zelf en de output.'
      id: "2.1.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 4.1.1
    - task: Is de inputdata relevant en representatief voor de beoogde toepassing?
      id: "2.1.2"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Gedeeltelijk
      - value: N.v.t.
      required_status: false
      references:
        invulhulp: 4.1.2
    - task: Toelichting
      description: Licht toe hoe de representativiteit is vastgesteld.
      id: "2.1.2-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.1.2"
          operator: any
        action: show
    - task: Zijn subpopulaties beschermd in de steekproefstrategie?
      id: "2.1.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: N.v.t.
      required_status: false
      references:
        invulhulp: 4.1.3
    - task: Toelichting
      description: Beschrijf welke subpopulaties zijn onderscheiden en hoe zij beschermd worden.
      id: "2.1.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.1.3"
          operator: any
        action: show
    - task: Is de variabelekeuze gemotiveerd en gerechtvaardigd?
      id: "2.1.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.1.4
    - task: Hoe houdt het systeem rekening met ongerechtvaardigde bias in de uitkomsten?
      id: "2.1.5"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.1.5
    - task: Kunnen beoogde gebruikers het systeem feitelijk gebruiken ongeacht hun kenmerken (toegankelijkheid)?
      id: "2.1.6"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Gedeeltelijk
      required_status: false
      references:
        invulhulp: 4.1.6
    - task: Toelichting
      description: Beschrijf eventuele toegankelijkheidsmaatregelen.
      id: "2.1.6-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.1.6"
          operator: any
        action: show
    - task: >-
        Zijn er monitoringsmechanismen ingericht om negatieve effecten voor specifieke groepen te signaleren?
      id: "2.1.7"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: In ontwikkeling
      required_status: false
      references:
        invulhulp: 4.1.7
    - task: Toelichting
      description: Beschrijf hoe de monitoring is ingericht.
      id: "2.1.7-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.1.7"
          operator: any
        action: show
  - task: 4.2 Accuraatheid
    description: Beschrijf hoe de nauwkeurigheid van het systeem wordt gemeten en geborgd.
    id: "2.2"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Hoe wordt de nauwkeurigheid van het systeem continu gemeten en gewaarborgd?
      id: "2.2.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 4.2.1
    - task: Welke acceptatiecriteria gelden voor de kwaliteit van input en output?
      id: "2.2.2"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.2.2
    - task: Sluiten de acceptatiecriteria aan bij de data en het doel van het systeem?
      id: "2.2.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Ja
      - value: Nee
      - value: Gedeeltelijk
      required_status: false
      references:
        invulhulp: 4.2.3
    - task: Toelichting
      description: Licht toe waarom de criteria aansluiten of wat er nog moet worden verbeterd.
      id: "2.2.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.2.3"
          operator: any
        action: show
    - task: Hoe wordt de output periodiek gemonitord?
      id: "2.2.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.2.4
    - task: Hoe worden afwijkingen van de acceptatiecriteria geanalyseerd en gecorrigeerd?
      id: "2.2.5"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.2.5
    - task: Wat zijn de resultaten van alternatieve modellen die zijn overwogen?
      id: "2.2.6"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.2.6
  - task: 4.3 Betrouwbaarheid
    description: Beschrijf hoe de betrouwbaarheid van het systeem is geborgd.
    id: "2.3"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Is het systeem betrouwbaar en hoe is dit vastgesteld?
      id: "2.3.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 4.3.1
    - task: Welke factoren hebben de meeste invloed op de prestaties van het systeem?
      id: "2.3.2"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.3.2
    - task: Is de testdata gescheiden voor validatie of wordt cross-validatie gebruikt?
      id: "2.3.3"
      type:
      - radio_option
      repeatable: false
      valueType: string
      options:
      - value: Testdata gescheiden
      - value: Cross-validatie
      - value: Beide
      - value: N.v.t.
      required_status: false
      references:
        invulhulp: 4.3.3
    - task: Toelichting
      description: Beschrijf de validatiemethodiek.
      id: "2.3.3-toelichting"
      type:
      - open_text
      repeatable: false
      required_status: false
      dependencies:
      - type: conditional
        condition:
          id: "2.3.3"
          operator: any
        action: show
    - task: Hoe is de hyperparameter-tuning onderbouwd en getest?
      id: "2.3.4"
      type:
      - open_text
      repeatable: false
      required_status: false
      references:
        invulhulp: 4.3.4
  - task: 4.4 Technische implementatie
    description: Beschrijf de technische opzet en infrastructuur van het systeem.
    id: "2.4"
    type:
    - task_group
    repeatable: false
    tasks:
    - task: Hoe is het systeem technisch geïmplementeerd?
      id: "2.4.1"
      type:
      - open_text
      repeatable: false
      required_status: true
      references:
        invulhulp: 4.4.1
    - task: Bijlagen
      id: "2.4.1-bijlagen"
      type:
      - task_group
      repeatable: true
      item_name: bijlage
      tasks:
      - task: Bijlage
        description: Upload een afbeelding. Optioneel kan je een titel, omschrijving en bron toevoegen.
        id: "2.4.1-bijlagen.1"
        type:
        - image
        repeatable: false
    - task: >-
        Past het systeem binnen de bestaande technische infrastructuur? Zo niet, welke maatregelen zijn getroffen?
      id: "2.4.2"
      type:
      - radio_option
      repeatable: false
