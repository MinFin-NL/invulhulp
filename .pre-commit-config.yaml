repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
        exclude: ^(template/CHART_NAME/.*.yaml|helmfile/apps/.*.yaml)
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=700"]
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # public/forms/*.json is generated from vendor/instrument-registry + the
  # overlays. Rebuilds whenever one of the inputs or outputs is staged; if the
  # result differs from what is staged, pre-commit fails and leaves the
  # regenerated files in the working tree: review, `git add`, commit again.
  - repo: local
    hooks:
      - id: forms-build
        name: forms up to date with instrument registry + overlays
        entry: node scripts/build-forms.mjs
        language: system
        pass_filenames: false
        files: ^(public/forms/|scripts/form-overlays/|scripts/lib/merge-form\.mjs|scripts/convert-form\.mjs|scripts/build-forms\.mjs|scripts/registry-map\.json|vendor/instrument-registry/)
