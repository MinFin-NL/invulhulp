version: 2

updates:
  # Frontend (Vue/Vite) — package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # TypeScript blijft bewust op 6.x. TypeScript 7 is de native (Go) compiler:
      # die exporteert ./lib/tsc niet meer, waardoor `vue-tsc` in `npm run build`
      # afbreekt met ERR_PACKAGE_PATH_NOT_EXPORTED. Er is nog geen vue-tsc-release
      # (laatste: 3.3.10) die TypeScript 7 ondersteunt.
      # Weer toestaan zodra vue-tsc TypeScript 7 aankan.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
          - "yjs"
          - "y-*"
      design-system:
        patterns:
          - "@nldd/*"
      dev-dependencies:
        dependency-type: "development"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend (Python) — pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images in Dockerfile.backend / Dockerfile.frontend
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # De backend blijft bewust op Python 3.13; 3.14 wordt niet voorgesteld.
      # Voor image-tags telt 3.13 -> 3.14 als een minor update, vandaar beide types.
      # Patch-updates binnen 3.13 blijven toegestaan.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Images pinned in docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
